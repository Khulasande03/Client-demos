# ============================================================
# MT5 AI Trading Bot - Configuration
# Edit this file to customise the bot. No coding required.
# ============================================================

# --- MT5 Account Credentials ---
mt5:
  login: 12345678          # Your MT5 account number
  password: "your_password" # Your MT5 password
  server: "ICMarkets-Demo"  # Your broker's server name (seen in MT5 login screen)

# --- Trading Settings ---
trading:
  symbol: "EURUSD"         # Symbol to trade (e.g. EURUSD, GBPUSD, XAUUSD)
  timeframe: "H1"          # Candle timeframe: M1 M5 M15 M30 H1 H4 D1
  lot_size: 0.01           # Trade size in lots (0.01 = micro lot)
  max_open_trades: 1       # Maximum number of simultaneous open trades

# --- Risk Management ---
risk:
  stop_loss_pips: 30       # Stop loss distance in pips
  take_profit_pips: 60     # Take profit distance in pips (2:1 RR by default)
  max_daily_loss_usd: 50   # Bot stops trading for the day if this loss is hit

# --- AI Model Settings ---
model:
  training_bars: 2000      # Number of historical bars used to train the model
  retrain_every_n_bars: 50 # Retrain model every N new bars (keeps it current)
  signal_threshold: 0.60   # Minimum prediction confidence to place a trade (0-1)
  future_bars: 5           # How many bars ahead the model predicts price direction

# --- Logging ---
logging:
  log_file: "trades.csv"   # File where all trades are recorded
  verbose: true            # Print detailed output to the console
